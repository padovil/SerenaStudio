<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Página no encontrada · Serena Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F1EA">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-noche-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/img/apple-touch-icon-noche.png">
<style>
@font-face{font-family:"Cormorant Garamond";src:url(/fuentes/cormorant-garamond-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Hanken Grotesk";src:url(/fuentes/hanken-grotesk-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
:root{--papel:#F6F1EA;--tinta:#22201C;--vino:#7A2E3A;--gris:#4F4A43;color-scheme:light}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--papel);color:var(--tinta);font:17px/1.6 "Hanken Grotesk",Arial,sans-serif;text-align:center;
  padding:2rem max(20px, env(safe-area-inset-right, 0px)) 2rem max(20px, env(safe-area-inset-left, 0px));box-sizing:border-box}
img{width:72px;height:70px;margin:0 auto 1.4rem;display:block}
h1{font:500 clamp(2.2rem, 9vw, 3rem)/1.05 "Cormorant Garamond",Georgia,serif;margin:0 0 1rem;text-wrap:balance}
p{color:var(--gris);margin:0 0 1.6rem;max-width:26rem}
a{color:var(--vino);font-weight:600;text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--vino);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/img/logo.png" alt="" width="72" height="70">
  <h1>Esta página no existe</h1>
  <p>Puede que el link esté incompleto. Si es la invitación de una boda, pidan a la pareja que les reenvíe el link.</p>
  <a href="/">Ir a Serena Studio</a>
</main>
</body>
</html>
